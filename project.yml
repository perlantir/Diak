name: HermesDesktop
options:
  bundleIdPrefix: com.uberkiwi.diak
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
  groupSortPosition: top
settings:
  base:
    SWIFT_VERSION: "5.9"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: "Automatic"
    CODE_SIGN_IDENTITY: "-"
    ENABLE_HARDENED_RUNTIME: YES
    SWIFT_TREAT_WARNINGS_AS_ERRORS: NO

# Phase 3 WU3.2: streaming markdown renderer dependencies.
# Authorized in Docs/Phases/Phase3/SCOPE.md.
# - swift-markdown: Apple AST library for incremental parsing
#   (branch: main per Apple's README guidance — tags are toolchain
#   snapshots, not stable releases).
# - Highlightr: syntax highlighting for code blocks. Fires on
#   close-fence only per SCOPE.md performance requirement.
packages:
  Markdown:
    url: https://github.com/swiftlang/swift-markdown.git
    branch: main
  Highlightr:
    url: https://github.com/raspu/Highlightr.git
    from: 2.3.0

targets:
  HermesDesktop:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: HermesDesktop
        excludes:
          - "Resources/Info.plist"
          - "Resources/HermesDesktop.entitlements"
    dependencies:
      - package: Markdown
        product: Markdown
      - package: Highlightr
        product: Highlightr
    resources:
      - HermesDesktop/Resources/Assets.xcassets
    info:
      path: HermesDesktop/Resources/Info.plist
      properties:
        CFBundleName: $(PRODUCT_NAME)
        CFBundleDisplayName: Diak
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        LSMinimumSystemVersion: "14.0"
        LSApplicationCategoryType: public.app-category.productivity
        NSHumanReadableCopyright: "© 2026 Diak"
        NSHighResolutionCapable: true
        CFBundleURLTypes:
          - CFBundleURLName: com.uberkiwi.diak
            CFBundleURLSchemes:
              - diak
    entitlements:
      path: HermesDesktop/Resources/HermesDesktop.entitlements
      properties:
        com.apple.security.app-sandbox: false
        com.apple.security.network.client: true
        com.apple.security.cs.allow-jit: true
        com.apple.security.cs.disable-library-validation: true
        com.apple.security.cs.allow-unsigned-executable-memory: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.uberkiwi.diak
        PRODUCT_NAME: Diak
        PRODUCT_MODULE_NAME: HermesDesktop
        GENERATE_INFOPLIST_FILE: NO
        COMBINE_HIDPI_IMAGES: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_PREVIEWS: YES

  HermesDesktopTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - HermesDesktopTests
    dependencies:
      - target: HermesDesktop
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.uberkiwi.diak.tests
        GENERATE_INFOPLIST_FILE: YES
        BUNDLE_LOADER: "$(TEST_HOST)"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Diak.app/Contents/MacOS/Diak"

schemes:
  HermesDesktop:
    build:
      targets:
        HermesDesktop: all
        HermesDesktopTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - HermesDesktopTests
    archive:
      config: Release
